name: RightMenuMaster
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: com.rightmenu.master
  deploymentTarget:
    macOS: "14.5"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0-beta.3"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
  configs:
    Debug:
      RCM_APP_GROUP: "$(DEVELOPMENT_TEAM).io.github.syjia06.rightclickmaster.dev.shared"
      RCM_URL_SCHEME: rightclickmaster-dev
    Release:
      RCM_APP_GROUP: "$(DEVELOPMENT_TEAM).io.github.syjia06.rightclickmaster.shared"
      RCM_URL_SCHEME: rightclickmaster

targets:
  RightMenuMaster:
    type: application
    platform: macOS
    sources:
      - path: MainApp
        excludes:
          - ContentView.swift
          - File.txt
          - Services
          - ViewModels
          - Views
      - path: Shared/V2
    settings:
      base:
        INFOPLIST_FILE: MainApp/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MainApp/RightMenuMaster.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster
    dependencies:
      - target: FinderExtension
        embed: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false

  RightMenuMasterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - BugCondition
          - Models
          - Extensions/UserDefaultsSharedTests.swift
          - PreservationPropertyTests.swift
          - PreservationPropertyTests2.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster.dev.tests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster.tests
    dependencies:
      - target: RightMenuMaster

  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension/FinderSync.swift
      - path: Shared/V2
        excludes:
          - SafeFileCreation.swift
    settings:
      base:
        INFOPLIST_FILE: FinderExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster.dev.finder
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.syjia06.rightclickmaster.finder
