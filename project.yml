name: RightMenuMaster
options:
  bundleIdPrefix: com.rightmenu.master
  deploymentTarget:
    macOS: "14.5"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  RightMenuMaster:
    type: application
    platform: macOS
    sources:
      - path: MainApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightmenu.master
        INFOPLIST_FILE: MainApp/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MainApp/RightMenuMaster.entitlements
    dependencies:
      - target: FinderExtension
        embed: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false

  RightMenuMasterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightmenu.master.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: RightMenuMaster

  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightmenu.master.finder-extension
        INFOPLIST_FILE: FinderExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
